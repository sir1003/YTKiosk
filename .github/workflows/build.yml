name: Build YTKiosk IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid (Code Signing Tool)
        run: |
          brew install ldid

      - name: Setup Theos Patched SDK (Fast Sparse Checkout)
        run: |
          rm -rf $HOME/theos/sdks
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/theos/sdks
          cd $HOME/theos/sdks
          git sparse-checkout set iPhoneOS14.5.sdk

      - name: Build Application & Package IPA
        run: |
          export THEOS=$HOME/theos
          echo "=== Cấu trúc file trong Repo ==="
          find . -maxdepth 4 -not -path '*/.*'

          # Tìm file Makefile ở mọi thư mục, không phân biệt hoa thường
          MAKE_FILE=$(find . -iname "*makefile*" -not -path "*/.*" | head -n 1)
          if [ -n "$MAKE_FILE" ]; then
            MAKE_DIR=$(dirname "$MAKE_FILE")
            MAKE_BASE=$(basename "$MAKE_FILE")
            echo "--> Tìm thấy: $MAKE_FILE trong thư mục $MAKE_DIR"
            cd "$MAKE_DIR"
            if [ "$MAKE_BASE" != "Makefile" ] && [ "$MAKE_BASE" != "makefile" ]; then
              echo "--> Đổi tên $MAKE_BASE thành Makefile"
              cp "$MAKE_BASE" Makefile
            fi
          else
            echo "LỖI: Không tìm thấy file Makefile nào trong repository!"
            exit 1
          fi

          make FINALPACKAGE=1

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTKiosk-IPA
          path: |
            YTKiosk.ipa
            **/YTKiosk.ipa
