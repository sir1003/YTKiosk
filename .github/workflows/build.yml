name: Build YTKiosk IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          cd ~/theos-sdks
          git sparse-checkout set iPhoneOS9.3.sdk iPhoneOS14.4.sdk iPhoneOS16.5.sdk
          cp -r iPhoneOS*.sdk ~/theos/sdks/ || true

      - name: Build IPA
        run: |
          export THEOS=~/theos
          make clean
          make package
        
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTKiosk-IPA
          path: YTKiosk.ipa
