name: Build YTKiosk IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          find $HOME/theos/sdks -name "module.map" -exec sh -c 'mv "$0" "$(dirname "$0")/module.modulemap"' {} \;

      - name: Build IPA
        run: |
          export THEOS=$HOME/theos
          make THEOS=$HOME/theos GO_EASY_ON_ME=1
        
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTKiosk-IPA
          path: YTKiosk.ipa
